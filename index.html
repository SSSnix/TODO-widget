<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Widget</title>
  <link rel="stylesheet" href="/src/renderer/style.css" />
</head>
<body>
<!-- Верхняя панель -->
<div class="drag-bar">
  <div class="window-controls left"></div> <!-- Пустой блок для баланса -->

  <span class="app-title">Todo Widget</span>

  <div class="window-controls right">
    <button class="control-btn settings-btn" id="settingsBtn" title="Настройки">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button class="control-btn" id="minimize">−</button>
    <button class="control-btn close" id="close">✕</button>
  </div>
</div>

<!-- Панель настроек (выравниваем по правой кнопке) -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header">
    <h3>⚙️ Настройки</h3>
    <button class="control-btn close-settings" id="closeSettings"></button>
  </div>

  <div class="settings-content">
    <div class="setting-group">
      <label class="setting-label">Тип фона</label>
      <div class="button-group">
        <button class="toggle-btn active" data-bg-type="transparent" id="bgTransparent">Прозрачный</button>
        <button class="toggle-btn" data-bg-type="solid" id="bgSolid">Сплошной</button>
      </div>
    </div>

    <div class="setting-group" id="opacityGroup">
      <label class="setting-label">Прозрачность: <span id="opacityValue">85</span>%</label>
      <input type="range" id="opacityRange" min="0" max="100" value="85" class="range-input" />
    </div>

    <div class="setting-group" id="colorGroup" style="display: none;">
      <label class="setting-label">Цвет фона</label>
      <div class="color-picker-wrapper">
        <input type="color" id="bgColorPicker" value="#1a1a2e" class="color-picker" />
        <div class="color-presets">
          <button class="color-preset" style="background: #1a1a2e" data-color="#1a1a2e"></button>
          <button class="color-preset" style="background: #2d3748" data-color="#2d3748"></button>
          <button class="color-preset" style="background: #1a202c" data-color="#1a202c"></button>
          <button class="color-preset" style="background: #28a745" data-color="#28a745"></button>
          <button class="color-preset" style="background: #6f42c1" data-color="#6f42c1"></button>
          <button class="color-preset" style="background: #d63384" data-color="#d63384"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Только своя вкладка -->
<div class="tabs" id="tabs">
  <div class="tab active" data-list="own">📝 Мой список</div>
</div>

<!-- Список задач -->
<div class="todo-list" id="todoList">
  <div class="placeholder-text">Задачи появятся здесь ✨</div>
</div>

<!-- Форма добавления -->
<form class="add-form" id="addForm">
  <input type="text" class="add-input" id="taskInput" placeholder="Новая задача..." autocomplete="off" />
  <button type="submit" class="add-btn">+</button>
</form>

<script type="module" src="/src/renderer/app.js"></script>
</body>
</html>
